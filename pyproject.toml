[project]
name = "laya-mbti-export"
version = "0.1.0"
description = "Export the pinned Laya multilingual checkpoint to browser assets for laya-mbti"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.10.0",
  "onnx==1.20.1",
  "safetensors==0.7.0",
  "huggingface-hub==1.4.1",
  "numpy==2.4.2",
  "laya==0.3.1",
  "onnxscript>=0.3",
]

# Model export is CPU-only; avoid downloading CUDA runtimes on Linux CI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
